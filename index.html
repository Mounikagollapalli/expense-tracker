<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly Expenses Report</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 p-0">
    <div class="border-2 border-black min-h-screen w-full">
        <!-- Title -->
        <div class="bg-pink-500 p-3">
            <h1 class="text-center text-xl sm:text-2xl md:text-3xl font-bold">EXPENSES REPORT</h1>
        </div>

        <!-- Inputs -->
        <div class="p-4 mt-2 flex flex-col md:flex-row items-stretch md:items-center gap-3">
            <div class="w-full md:flex-1">
                <input type="date" id="date" class="w-full border border-gray-300 rounded-md p-3">
            </div>
            <div class="w-full md:flex-1">
                <input type="text" id="amount" class="w-full border border-gray-300 rounded-md p-3" placeholder="AMOUNT">
            </div>
            <div class="w-full md:flex-1">
                <select class="tr-type w-full border border-gray-300 rounded-md p-3">
                    <option selected>TRANSACTION TYPE</option>
                    <option value="DEBITED">DEBITED</option>
                    <option value="CREDITED">CREDITED</option>
                </select>
            </div>
            <button onclick="addBtn()" class="w-full md:w-20 h-12 rounded-xl bg-pink-500 hover:bg-pink-700 text-white text-3xl font-bold transition">+</button>
        </div>

        <!-- Cards -->
        <div class="p-4 mt-2 flex flex-col sm:flex-row flex-wrap justify-around items-center gap-5">
            <div class="bg-pink-500 hover:bg-pink-700 hover:scale-105 transition rounded-lg shadow-md w-full sm:w-[45%] lg:w-[30%]">
                <div class="p-5">
                    <h5 class="text-lg font-semibold">TOTAL BALANCE</h5>
                    <h4 class="text-2xl font-bold mt-2">₹<span id="tb">0</span></h4>
                </div>
            </div>
            <div class="bg-pink-500 hover:bg-pink-700 hover:scale-105 transition rounded-lg shadow-md w-full sm:w-[45%] lg:w-[30%]">
                <div class="p-5">
                    <h5 class="text-lg font-semibold">TOTAL DEBITED</h5>
                    <h4 class="text-2xl font-bold mt-2">₹<span id="te">0</span></h4>
                </div>
            </div>
            <div class="bg-pink-500 hover:bg-pink-700 hover:scale-105 transition rounded-lg shadow-md w-full sm:w-[45%] lg:w-[30%]">
                <div class="p-5">
                    <h5 class="text-lg font-semibold">TOTAL CREDITED</h5>
                    <h4 class="text-2xl font-bold mt-2">₹<span id="ti">0</span></h4>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="p-4 m-2 overflow-x-auto">
            <table class="w-full min-w-[500px] border-collapse text-center" id="tr-table">
                <tr class="bg-pink-500">
                    <th class="border border-gray-400 p-3">DATE</th>
                    <th class="border border-gray-400 p-3">TRANSACTION</th>
                    <th class="border border-gray-400 p-3">AMOUNT</th>
                    <th class="border border-gray-400 p-3">ACTION</th>
                </tr>
            </table>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        let transactionTable = document.getElementById("tr-table")

        function addBtn() {
            let date = document.getElementById("date").value
            let amount = document.getElementById("amount").value
            let transactionType = document.getElementsByClassName("tr-type")[0].value

            console.log(date, amount, transactionType)

            let row = document.createElement("tr")
            let datecell = document.createElement("td")
            datecell.innerText = date

            let trcell = document.createElement("td")
            trcell.innerText = transactionType

            let amountcell = document.createElement("td")
            amountcell.innerText = amount

            let deletecell = document.createElement("td")
            let deletebtn = document.createElement("button")
            deletebtn.innerText = "Delete"
            deletebtn.className = "bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-700"
            deletebtn.onclick = () => deleteRow(row)
            deletecell.appendChild(deletebtn)

            row.appendChild(datecell)
            row.appendChild(trcell)
            row.appendChild(amountcell)
            row.appendChild(deletecell)

            row.className = "border border-gray-400"
            datecell.className = "border border-gray-400 p-3"
            trcell.className = "border border-gray-400 p-3"
            amountcell.className = "border border-gray-400 p-3"
            deletecell.className = "border border-gray-400 p-3"

            transactionTable.appendChild(row)

            let totalbalance = document.getElementById("tb").innerText
            let totaldebited = document.getElementById("te").innerText
            let totalcredited = document.getElementById("ti").innerText

            if (transactionType == "CREDITED") {
                if (totalbalance == "0") {
                    document.getElementById("tb").innerText = amount
                } else {
                    document.getElementById("tb").innerText =
                        parseInt(totalbalance) + parseInt(amount)
                }

                if (totalbalance == "0") {
                    document.getElementById("ti").innerText = amount
                } else {
                    document.getElementById("ti").innerText =
                        parseInt(totalcredited) + parseInt(amount)
                }
            } else if (transactionType == "DEBITED") {
                document.getElementById("tb").innerText =
                    parseInt(totalbalance) - parseInt(amount)

                if (totaldebited == "0") {
                    document.getElementById("te").innerText = amount
                } else {
                    document.getElementById("te").innerText =
                        parseInt(totaldebited) + parseInt(amount)
                }
            }
        }

        function deleteRow(row) {
            row.remove()
        }
    </script>
</body>
</html>
